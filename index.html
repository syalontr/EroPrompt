<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词随机生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #e8e8f0;
    padding: 32px 16px;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 28px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { text-align: center; color: #8b8ba3; font-size: 13px; margin-bottom: 28px; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .input-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 8px 14px;
  }
  .input-group label { font-size: 13px; color: #b8b8cc; white-space: nowrap; }
  .input-group input {
    width: 64px;
    padding: 4px 8px;
    font-size: 14px;
    color: #e8e8f0;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(96, 165, 250, 0.35);
    border-radius: 6px;
    text-align: center;
    font-family: Consolas, monospace;
  }
  .input-group input:focus { outline: none; border-color: #60a5fa; }

  .btn {
    padding: 10px 22px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  }
  #generateBtn {
    padding: 12px 40px;
    font-size: 16px;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    border-radius: 999px;
    box-shadow: 0 4px 24px rgba(124, 58, 237, 0.45);
  }
  #generateBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124, 58, 237, 0.6); }
  #lockAllBtn {
    background: rgba(245, 158, 11, 0.16);
    border: 1px solid rgba(245, 158, 11, 0.5);
  }
  #lockAllBtn:hover { background: rgba(245, 158, 11, 0.32); }

  .btn-reset {
    background: rgba(239, 68, 68, 0.16);
    border: 1px solid rgba(239, 68, 68, 0.5);
    padding: 8px 16px;
  }
  .btn-reset:hover { background: rgba(239, 68, 68, 0.32); }
  .reset-check {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #b8b8cc;
    cursor: pointer;
    white-space: nowrap;
  }
  .reset-check input { accent-color: #ef4444; cursor: pointer; }

  .prefix-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 4px;
    flex-wrap: wrap;
  }
  .prefix-label {
    font-size: 13px;
    color: #b8b8cc;
    white-space: nowrap;
  }
  .prefix-input {
    flex: 1;
    min-width: 300px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 6px;
    padding: 8px 12px;
    color: #e4e4f0;
    font-size: 13px;
    font-family: ui-monospace, "Consolas", monospace;
  }
  .prefix-input:focus { outline: none; border-color: #60a5fa; }

  #summary { text-align: center; color: #9d9db8; font-size: 13px; margin-bottom: 20px; min-height: 18px; }

  .main-layout { display: flex; gap: 24px; align-items: flex-start; }
  #result { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .output-panel {
    width: 400px;
    flex-shrink: 0;
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  @media (max-width: 960px) {
    .main-layout { flex-direction: column; }
    .output-panel { width: 100%; position: static; }
  }

  .category-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    padding: 16px 20px;
    backdrop-filter: blur(6px);
    transition: opacity 0.15s, border-color 0.15s;
  }
  .category-card.inactive { opacity: 0.8; }
  .category-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #a78bfa;
    margin-bottom: 12px;
  }
  .category-card.inactive .category-name { color: #8d8da8; }

  .cat-ban-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: #2a2a3d;
    color: #8b8ba3;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .cat-ban-btn:hover { border-color: #ef4444; color: #fca5a5; }

  .cat-limit-input {
    flex-shrink: 0;
    width: 52px;
    padding: 2px 6px;
    font-size: 12px;
    color: #fde68a;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(251, 191, 36, 0.35);
    border-radius: 6px;
    text-align: center;
    font-family: Consolas, monospace;
  }
  .cat-limit-input:focus { outline: none; border-color: #fbbf24; }
  .cat-limit-input::placeholder { color: #6d6d85; }
  .category-card.banned { opacity: 0.45; border-color: rgba(239, 68, 68, 0.45); }
  .category-card.banned .category-name { color: #f87171; }
  .category-card.banned .cat-ban-btn {
    background: #ef4444;
    border-color: #ef4444;
    color: #fff;
  }
  .category-card.banned .word-list { pointer-events: none; opacity: 0.6; }

  .word-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .word-chip {
    position: relative;
    background: rgba(96, 165, 250, 0.1);
    border: 1px solid rgba(96, 165, 250, 0.28);
    border-radius: 10px;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.12s, border-color 0.12s, background 0.12s;
  }
  .word-chip:hover { border-color: rgba(96, 165, 250, 0.6); }
  .word-en { font-size: 14px; color: #93c5fd; font-family: Consolas, monospace; }
  .word-zh { font-size: 12px; color: #b8b8cc; }

  .word-chip.unselected {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    padding: 4px 10px;
    opacity: 0.75;
  }
  .word-chip.unselected .word-en { font-size: 13px; color: #a0a0b8; }
  .word-chip.unselected .word-zh { font-size: 11px; color: #808098; }
  .word-chip.unselected:hover { opacity: 1; border-color: rgba(96, 165, 250, 0.45); }

  .word-chip.locked {
    border-color: rgba(245, 158, 11, 0.65);
    background: rgba(245, 158, 11, 0.1);
    opacity: 1;
  }
  .word-chip.locked .word-en { color: #fcd34d; }

  .lock-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: #2a2a3d;
    color: #8b8ba3;
    font-size: 11px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .lock-btn:hover { border-color: #f59e0b; color: #fcd34d; }
  .word-chip.locked .lock-btn {
    background: #f59e0b;
    border-color: #f59e0b;
    color: #1a1a2e;
  }

  .ban-btn {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: #2a2a3d;
    color: #8b8ba3;
    font-size: 11px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .ban-btn:hover { border-color: #ef4444; color: #fca5a5; }
  .word-chip.banned .ban-btn {
    background: #ef4444;
    border-color: #ef4444;
    color: #fff;
  }
  .word-chip.banned {
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.4);
    opacity: 0.55;
    cursor: not-allowed;
  }
  .word-chip.banned .word-en { color: #f87171; text-decoration: line-through; }
  .word-chip.banned .word-zh { color: #7f5a5a; }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .output-title { font-size: 15px; font-weight: bold; color: #34d399; }
  #copyBtn {
    padding: 6px 18px;
    font-size: 13px;
    color: #fff;
    background: rgba(52, 211, 153, 0.18);
    border: 1px solid rgba(52, 211, 153, 0.45);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #copyBtn:hover { background: rgba(52, 211, 153, 0.35); }
  #output {
    width: 100%;
    min-height: 480px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(52, 211, 153, 0.3);
    border-radius: 12px;
    color: #a7f3d0;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.8;
    padding: 16px;
    resize: vertical;
  }
  #output:focus { outline: none; border-color: #34d399; }

  .fav-fab {
    position: fixed;
    top: 16px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(251, 191, 36, 0.55);
    background: rgba(34, 34, 58, 0.92);
    backdrop-filter: blur(8px);
    font-size: 24px;
    line-height: 1;
    color: #fbbf24;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    z-index: 200;
  }
  .fav-fab:hover { transform: scale(1.1) rotate(8deg); background: rgba(251, 191, 36, 0.18); }
  .fav-fab .fav-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 9px;
    background: #ef4444;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    line-height: 18px;
    text-align: center;
  }

  .fav-pop {
    position: fixed;
    top: 80px;
    right: 16px;
    width: 380px;
    max-width: calc(100vw - 32px);
    background: #22223a;
    border: 1px solid rgba(251, 191, 36, 0.35);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    padding: 16px 18px;
    z-index: 90;
    display: none;
  }
  .fav-pop.open { display: block; }
  .fav-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .fav-panel-title { font-size: 15px; font-weight: bold; color: #fbbf24; }
  .fav-panel-close {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: #b8b8cc;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .fav-panel-close:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
  #saveFavBtn {
    width: 100%;
    padding: 8px 0;
    font-size: 13px;
    color: #fff;
    background: rgba(251, 191, 36, 0.18);
    border: 1px solid rgba(251, 191, 36, 0.45);
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.15s;
  }
  #saveFavBtn:hover { background: rgba(251, 158, 11, 0.35); }
  .fav-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 46vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(251, 191, 36, 0.45) transparent;
    padding-right: 4px;
  }
  .fav-list::-webkit-scrollbar { width: 8px; }
  .fav-list::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); border-radius: 4px; }
  .fav-list::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.45); border-radius: 4px; }
  .fav-list::-webkit-scrollbar-thumb:hover { background: rgba(251, 191, 36, 0.7); }
  .fav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(251, 191, 36, 0.07);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: 8px;
    padding: 8px 12px;
    transition: background 0.15s;
  }
  .fav-item:hover { background: rgba(251, 191, 36, 0.1); }
  .fav-item-name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: #fde68a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .fav-item-count { font-size: 11px; color: #9d9db8; flex-shrink: 0; }
  .fav-item button {
    flex-shrink: 0;
    padding: 4px 10px;
    font-size: 12px;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .fav-item button:hover { background: rgba(255, 255, 255, 0.2); }
  .fav-item .fav-del { color: #fca5a5; }
  .fav-item .fav-load { background: rgba(59, 130, 246, 0.2); border-color: rgba(96, 165, 250, 0.45); }
  .fav-item .fav-load:hover { background: rgba(96, 165, 250, 0.35); }
  .fav-item .fav-edit { background: rgba(124, 58, 237, 0.18); border-color: rgba(167, 139, 250, 0.4); }
  .fav-item .fav-edit:hover { background: rgba(139, 92, 246, 0.35); }
  .fav-edit-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(124, 58, 237, 0.08);
    border: 1px solid rgba(124, 58, 237, 0.45);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .fav-edit-input {
    flex: 1;
    min-width: 0;
    padding: 5px 10px;
    font-size: 13px;
    color: #fde68a;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(251, 191, 36, 0.45);
    border-radius: 6px;
  }
  .fav-edit-input:focus { outline: none; border-color: #fbbf24; }
  .fav-empty { font-size: 12px; color: #8b8ba3; text-align: center; padding: 12px 0; }

  .fav-stats {
    margin-top: 10px;
    border-top: 1px solid rgba(251, 191, 36, 0.2);
    padding-top: 10px;
  }
  .fav-stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .fav-stats-title { font-size: 13px; font-weight: bold; color: #e8d48a; }
  .fav-stats-more {
    padding: 3px 10px;
    font-size: 12px;
    color: #e8d48a;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .fav-stats-more:hover { background: rgba(251, 191, 36, 0.28); color: #fff; }
  .ws-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(251, 191, 36, 0.45) transparent;
    padding-right: 4px;
  }
  .fav-stats .ws-list { max-height: 30vh; }
  .ws-list::-webkit-scrollbar { width: 8px; }
  .ws-list::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); border-radius: 4px; }
  .ws-list::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.45); border-radius: 4px; }
  .ws-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 6px;
  }
  .ws-row:hover { background: rgba(255, 255, 255, 0.07); }
  .ws-rank {
    width: 26px;
    flex-shrink: 0;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    color: #9d9db8;
  }
  .ws-rank.top1 { color: #fbbf24; }
  .ws-rank.top2 { color: #e2e8f0; }
  .ws-rank.top3 { color: #e08c4a; }
  .ws-words {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ws-en { font-size: 12px; color: #ffe9a8; }
  .ws-zh { font-size: 11px; color: #8b8ba3; margin-left: 6px; }
  .ws-bar-wrap {
    flex-shrink: 0;
    width: 56px;
    height: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 8px;
  }
  .ws-bar { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #fbbf24); border-radius: 3px; }
  .ws-count { flex-shrink: 0; min-width: 30px; text-align: right; font-size: 12px; font-weight: bold; color: #fbbf24; }
  .stats-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 120;
  }
  .stats-overlay.open { display: flex; }
  .stats-modal {
    background: #22223a;
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    padding: 18px 22px;
    width: 460px;
    max-width: 92vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .stats-modal-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  .stats-modal-title { flex: 1; font-size: 15px; font-weight: bold; color: #fbbf24; }
  .stats-modal-close {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: #b8b8cc;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .stats-modal-close:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
  .stats-modal-copy {
    margin-right: 10px;
    padding: 5px 12px;
    font-size: 12px;
    color: #fff;
    background: rgba(52, 211, 153, 0.16);
    border: 1px solid rgba(52, 211, 153, 0.45);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .stats-modal-copy:hover { background: rgba(52, 211, 153, 0.35); }
  .stats-modal .ws-list { max-height: 62vh; }
</style>
</head>
<body>
<div class="container">
  <h1>提示词随机生成器</h1>
  <p class="subtitle">点击词条切换选中，右上角小锁锁定，左上角屏蔽后不再参与随机，分类左侧按钮可屏蔽整个分类</p>

  <div class="controls">
    <div class="input-group">
      <label>随机类别数</label>
      <input id="catCount" type="number" min="1" value="12">
    </div>
    <div class="input-group">
      <label>每类词条数</label>
      <input id="wordCount" type="number" min="1" value="4">
    </div>
    <button id="generateBtn" class="btn">生成提示词</button>
    <button id="lockAllBtn" class="btn">🔒 锁定所有已选</button>
    <div class="input-group">
      <button id="resetBtn" class="btn btn-reset">重置</button>
      <label class="reset-check"><input id="resetClearBan" type="checkbox">清除屏蔽</label>
      <label class="reset-check"><input id="resetClearLimit" type="checkbox">清除分类词条数限制</label>
    </div>
  </div>

  <div class="prefix-row">
    <label class="prefix-label">前置提示词</label>
    <input id="prefixInput" type="text" class="prefix-input" value="masterpiece,best quality,amazing quality,absurdres,bonneyillustrious,sexy,NSFW,hentai,porno,">
  </div>

  <p id="summary"></p>

  <div class="main-layout">
    <div id="result"></div>
    <div class="output-panel">
      <div class="output-header">
        <span class="output-title">生成结果（每行一个类别）</span>
        <button id="copyBtn">复制</button>
      </div>
      <textarea id="output" readonly placeholder="点击上方按钮生成提示词..."></textarea>
    </div>
  </div>
</div>

<button id="favFab" class="fav-fab" title="收藏">⭐<span id="favBadge" class="fav-badge" style="display:none;">0</span></button>

<div id="favPop" class="fav-pop">
  <div class="fav-panel-header">
    <span class="fav-panel-title">⭐ 收藏记录</span>
    <button id="favCloseBtn" class="fav-panel-close">✕</button>
  </div>
  <button id="saveFavBtn">⭐ 收藏当前选中</button>
  <div id="favList" class="fav-list"></div>
  <div id="favStats" class="fav-stats"></div>
</div>

<div id="statsOverlay" class="stats-overlay">
  <div class="stats-modal">
    <div class="stats-modal-header">
      <span class="stats-modal-title">📊 词条收藏统计（全部）</span>
      <button id="statsCopyBtn" class="stats-modal-copy">📋 复制所有词条</button>
      <button id="statsCloseBtn" class="stats-modal-close">✕</button>
    </div>
    <div id="statsModalList" class="ws-list"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.min.js"></script>
</body>
</html>
